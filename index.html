<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Fluxo Compras — Sistema de Gestão de Compras Corporativas" />
  <title>Fluxo Compras</title>
  <link rel="icon" type="image/x-icon" href="Logos/concrem-fav.ico" />

  <!-- PWA -->
  <meta name="theme-color" content="#0a2e16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FluxoCompras">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/Logos/Isotipo-CorBranco.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- App container principal -->
  <div id="app"></div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal global -->
  <div id="modal-container"></div>

  <!-- Loading overlay global -->
  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-spinner">
      <div class="spinner"></div>
      <span>Carregando...</span>
    </div>
  </div>

  <!-- JS — ordem de carregamento: config → utilitários → core → páginas -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils/logoBase64.js"></script>
  <script src="js/utils/pdfPrint.js"></script>
  <script src="js/utils/datepicker.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/utils/permissoes.js"></script>
  <script src="js/components.js"></script>

  <!-- Páginas -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/requisicoes.js"></script>
  <script src="js/pages/aprovacoes.js"></script>
  <script src="js/pages/cotacoes.js"></script>
  <script src="js/pages/ordens.js"></script>
  <script src="js/pages/recebimento.js"></script>
  <script src="js/pages/qualidade.js"></script>
  <script src="js/pages/fornecedores.js"></script>
  <script src="js/pages/relatorios.js"></script>
  <script src="js/pages/catalogo.js"></script>
  <script src="js/pages/catalogo-categorias.js"></script>
  <script src="js/pages/usuarios.js"></script>
  <script src="js/pages/fornecedores-cadastro.js"></script>
  <script src="js/pages/configuracoes.js"></script>

  <!-- Utilitários de negócio -->
  <script src="js/utils/fluxoAprovacao.js"></script>

  <!-- Notificações -->
  <script src="js/utils/notificacoes.js"></script>

  <!-- Custom Select -->
  <script src="js/utils/customSelect.js"></script>

  <!-- App principal (roteador) — sempre por último -->
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[SW] Registrado:', reg.scope))
          .catch(err => console.warn('[SW] Falha:', err));
      });
    }
  </script>

</body>
</html>
